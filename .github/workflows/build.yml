# Builds the Imanginable agent from the PRIVATE source repo and publishes the result
# as a release here. This repo is public so the build minutes are free; the source is
# fetched at build time with a read-only deploy key and never leaves the runner — nothing
# but the compiled binaries is uploaded, and the build runs quietly so the public log
# shows no source.
#
# Trigger: the source repo's agent/build/release.py runs it on main with a version, the
# private-repo ref `agent-vX.Y.Z` and publish=true; the publish job makes the tag
# `vX.Y.Z` here. It runs on main, not on a pushed tag, because a run's caches belong to
# its ref and a tag's run reads only its own and main's: from tags, every release would
# save its compiler cache where no later one looks. A pushed tag `vX.Y.Z` still builds
# and publishes (from main's cache, never saving a useful one). Pull requests never run
# it (no trigger, no secrets for forks).
#
# Secrets (Settings → Secrets and variables → Actions):
#   SOURCE_DEPLOY_KEY     private half of a READ-ONLY deploy key registered on
#                         Ikolvi/imanginable ("ve-agent CI (read-only)")
#   MINISIGN_SECRET_KEY   the release signing key (agent/build/sign.py keygen in the source);
#                         its public half is compiled into the agent
#   R2_ACCESS_KEY_ID      an R2 API token (Object Read & Write on the bucket below) — what
#   R2_SECRET_ACCESS_KEY  publishes the files to https://dl.imanginable.com, the address
#                         installers and the agent's self-update fetch from (see below)
#
# Where the files go: the GitHub release (history, and the fallback the installers use)
# AND the Cloudflare R2 bucket behind https://dl.imanginable.com, at fixed names so each
# release REPLACES the last one there. Clients read from dl.imanginable.com: R2's egress
# is free and Cloudflare's edge caches the files worldwide, while GitHub's release
# storage took a minute to answer from some networks. Cache-Control max-age=300 on the
# objects means a new release shows up at the edge within five minutes.
name: build
run-name: agent ${{ inputs.version || github.ref_name }}${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && ' (test, not published)' || '' }}
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version: { description: "version x.y.z", required: true }
      ref: { description: "private-repo ref to build", default: "main" }
      publish: { description: "create the release", type: boolean, default: false }
      archive: { description: "onefile as archive (per-file compression, cached) - try the exe on a real PC first", type: boolean, default: false }

permissions:
  contents: write          # the release
  actions: write           # the build rows wait for the ui job's artifact; it is deleted after

# Releases are cut whenever a change needs one, even while another is building. They
# queue here and publish one after another, in the order they were tagged, so two can
# never race on dl.imanginable.com's manifest. Never cancelled: every tag is published.
concurrency:
  group: agent-release
  cancel-in-progress: false

env:
  SOURCE_REPO: Ikolvi/imanginable
  DL_URL: https://dl.imanginable.com                    # the R2 bucket's custom domain
  R2_BUCKET: imanginable-agent
  R2_ACCOUNT_ID: e09b6e290483127c3121bba67095241d       # not a secret: it is in every R2 endpoint URL
  PYTHON: "3.14"           # the newest Python Nuitka compiles with; the dev PC and the server run 3.14 too. Needs the 24.04 Linux images — the 22.04 toolcache 3.14 has a zstd without threading and Nuitka's onefile compressor fails ("nb_workers … valid range is [0, 0]")

jobs:
  meta:
    # Pinned, not ubuntu-latest: the newest Ubuntu (26.04), and no surprise when the
    # label moves. The Linux BUILD rows below stay on 24.04 on purpose — see there.
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; ref="agent-v$v"; publish=true
          else
            v="${{ inputs.version }}"; ref="${{ inputs.ref }}"; publish="${{ inputs.publish }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The studio UI, built once and shared: the same static files on every platform (the
  # bundle app.imanginable.com serves anyway; no source maps). It runs BESIDE the build
  # rows, not before them: each row waits for it only once its own setup is done.
  ui:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.meta.outputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: studio UI
        run: npm ci --prefix web --no-audit --no-fund > ui.log 2>&1 && python build_ui.py >> ui.log 2>&1 || { tail -30 ui.log; exit 1; }
      - uses: actions/upload-artifact@v7
        with: { name: ui, path: web/out, retention-days: 1, if-no-files-found: error, include-hidden-files: true }
      # Session replays (Clarity) fetch a page's stylesheets themselves, signed out. A
      # studio page comes from the person's own agent, whose content-hashed files the box
      # does not have, so the box sends a signed-out request for one to
      # dl.imanginable.com/ui/_next/static/... — copied here: styles, fonts and pictures
      # only, NEVER the scripts. Added beside every earlier release's (hashed names never
      # clash, and an older agent's replays keep their styles), so no --delete.
      - name: studio styles to dl.imanginable.com/ui (R2)
        if: needs.meta.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "::warning::R2 secrets not set — studio styles not copied"; exit 0; fi
          aws s3 sync web/out/_next/static "s3://$R2_BUCKET/ui/_next/static" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --exclude "*" --include "*.css" --include "*.woff2" --include "*.woff" --include "*.ttf" \
            --include "*.png" --include "*.jpg" --include "*.svg" --include "*.webp" --include "*.ico" \
            --cache-control "public, max-age=31536000, immutable" --size-only --only-show-errors
          echo "studio styles copied: $(find web/out/_next/static -type f \( -name '*.css' -o -name '*.woff*' -o -name '*.png' \) | wc -l) files"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # cc: the compiler, in the cache key — Windows builds with clang-cl (agent/build/build.py)
          - { os: windows-latest,   key: windows-x86_64, exe: imanginable.exe, suffix: ".exe", cc: "-clang" }
          - { os: windows-latest,   key: windows-x86_64-noconsole, exe: imanginablew.exe, suffix: ".exe", flags: "--no-console", cc: "-clang" }   # the logon task's windowless twin
          - { os: ubuntu-24.04,     key: linux-x86_64,   exe: imanginable,     suffix: "" }   # glibc ≥ 2.39: Ubuntu 24.04+, Debian 13+, Fedora 40+ (22.04 images cannot build Python 3.14 onefiles, see PYTHON)
          - { os: ubuntu-24.04-arm, key: linux-arm64,    exe: imanginable,     suffix: "" }   # Pi 4/5, ARM servers
          # The Linux rows are NOT on 26.04, deliberately: a binary needs at least the glibc
          # of the image it was built on, and 26.04's would stop it starting on Ubuntu 24.04,
          # Debian 13 and Raspberry Pi OS. Move them only when those are no longer targets.
          # The newest macOS image (macos-14 is deprecated and its runs fail). What a Mac
          # needs is pinned by MACOSX_DEPLOYMENT_TARGET below, not by the image: built on
          # 26 with no target, the binary would refuse to start on anything older.
          - { os: macos-26,         key: darwin-arm64,   exe: imanginable,     suffix: "", mac_min: "11.0" }   # Apple Silicon (every Mac since 2020, which shipped with macOS 11)
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.mac_min }}   # empty, and ignored, off macOS
    steps:
      # The runner's own antivirus scans every file Nuitka and clcache write and read,
      # thousands of small ones. A throwaway VM; the binary is not touched by this.
      - name: real-time scanning off (Windows runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      - name: source (private, read-only token)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.meta.outputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      # pip's and npm's download caches (not the installs): the wheels and packages come
      # from the runner's cache instead of the network, most noticeable on Windows.
      # check-latest: the newest 3.14.x every time, not whichever one the runner image
      # has in its toolcache. GitHub rolls a new image out over days, so one release can
      # land on 3.14.7 and the next on 3.14.8 — and every compiled file depends on
      # Python's headers, so a cache from the other patch release hits nothing (913 of
      # 913 files rebuilt, ~15 min instead of ~4).
      - uses: actions/setup-python@v7
        id: py
        with: { python-version: "${{ env.PYTHON }}", check-latest: true, cache: pip, cache-dependency-path: agent/requirements-agent.txt }
      - run: pip install -q -r agent/requirements-agent.txt nuitka ordered-set zstandard
      # The compiler cache, kept between releases: a release changes a handful of our
      # modules, and every other C file (Flask, the Google libraries, cryptography, the
      # rest of ours) compiles exactly as last time. ccache on Linux/macOS, Nuitka's own
      # clcache (for clang-cl) on Windows; both live under NUITKA_CACHE_DIR. Saved under a new
      # key every run (a cache entry is never overwritten) and restored from the newest,
      # so each release starts from the one before it.
      - name: ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q ccache > /dev/null
      - name: ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install -q ccache
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          # The EXACT Python in the key: a cache is only restored onto the patch release
          # it was compiled against. After a Python update the first build of each
          # platform compiles everything once; every build after it hits again.
          key: nuitka-${{ matrix.key }}${{ matrix.cc }}-py${{ steps.py.outputs.python-version }}-${{ github.run_id }}
          restore-keys: nuitka-${{ matrix.key }}${{ matrix.cc }}-py${{ steps.py.outputs.python-version }}-
      # The studio UI (the brain inside the agent serves it), from the ui job: waited for
      # here, after this row's own setup, so the two ran at the same time.
      - name: studio UI (from the ui job)
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for i in $(seq 1 120); do
            [ "$(gh api "$api/artifacts" --jq '[.artifacts[] | select(.name == "ui")] | length')" = "1" ] && exit 0
            [ "$(gh api "$api/jobs" --jq '[.jobs[] | select(.name == "ui" and .conclusion == "failure")] | length')" = "1" ] && { echo "the ui job failed"; exit 1; }
            sleep 5
          done
          echo "no ui artifact after 10 min"; exit 1
      - uses: actions/download-artifact@v8
        with: { name: ui, path: web/out }
      - name: build (Nuitka onefile, quiet)
        shell: bash
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        # Every line is stamped with the seconds since the build started, so the step
        # below can say which phase the time went to.
        run: |
          python -u agent/build/build.py --onefile --out dist --version "${{ needs.meta.outputs.version }}" ${{ matrix.flags }} ${{ inputs.archive && '--archive' || '' }} 2>&1 \
            | python -u -c "import sys,time; t=time.time(); [sys.stdout.write('[%5ds] %s' % (time.time()-t, l)) for l in sys.stdin]" > build.log \
            || { tail -40 build.log; exit 1; }
      # Counts and phase times only (how many C files were compiled, how many came from
      # the cache, when each Nuitka phase started) — anything quoted is masked and no
      # other line is printed, so the public log still shows no file or module name.
      - name: cache hits + phase times
        if: always()
        shell: bash
        run: |
          grep -E "Compiled [0-9]+ C files|Cached C files" build.log | sed -E 's/^[^:]*Scons[^:]*: *//' || true
          grep -E "Starting Python compilation|Completed Python level|Generating source code|Running data composer|Running C compilation|Compiled [0-9]+ C files|Creating single file|Running bootstrap binary|Using compression|Successfully created|Removing (build directory|dist folder)" build.log \
            | sed -E "s/'[^']*'/'…'/g" || true
          tail -1 build.log | grep -oE '^\[ *[0-9]+s\]' | sed 's/^/finished at /' || true
      - name: name by platform
        shell: bash
        run: mkdir out && mv "dist/${{ matrix.exe }}" "out/imanginable-${{ matrix.key }}${{ matrix.suffix }}" && ls -la out
      # The binary starts on the runner: its CLI parses and it reads its own state
      # (`status` exits 0 unpaired). Only on the runner's CPU: a zig build passed this and
      # still died with "Illegal instruction" on a real PC, so a new compiler or flag is
      # tried on one before it ships. The windowless twin may print nothing, so only the
      # console builds are held to their output.
      - name: smoke test
        shell: bash
        run: |
          b="./out/imanginable-${{ matrix.key }}${{ matrix.suffix }}"
          "$b" --version
          out=$("$b" status 2>&1)
          if [ -z "${{ matrix.flags }}" ]; then echo "$out" | grep -q "(compiled)"; fi
          echo "smoke test passed"
      - uses: actions/upload-artifact@v7
        with: { name: "imanginable-${{ matrix.key }}", path: out/*, if-no-files-found: error }

  # The ui job's artifact was only for the build rows: gone once they are done.
  ui-cleanup:
    needs: [ui, build]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "ui") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: sign.py + installers from the source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.meta.outputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: agent/build
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON }}" }
      - run: pip install -q cryptography
      # Only the binaries: the ui artifact may still exist (ui-cleanup runs beside this
      # job), and its files in builds/ broke the upload loop on a first run.
      - uses: actions/download-artifact@v8
        with: { path: builds, pattern: "imanginable-*", merge-multiple: true }
      - name: manifest + signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          v="${{ needs.meta.outputs.version }}"
          python agent/build/sign.py manifest --version "$v" --base "$DL_URL" --out builds/manifest.json builds/imanginable-*
          python agent/build/sign.py sign builds/manifest.json
          cp agent/build/install.sh agent/build/install.ps1 builds/
          ls -la builds && cat builds/manifest.json
      # The release is made empty and then filled one file at a time. Uploading the five
      # 33-63 MB binaries in one `gh release create` call fails often (HTTP 400, or a 422
      # "already exists" when gh retries a half-finished upload), and a failed create
      # deletes the release, so the tag ends up with no build at all. --clobber makes each
      # upload idempotent, so a retry is just the same command again.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.meta.outputs.version }}"
          notes="Imanginable agent $v — install instructions in the README. Every file's sha256 is in manifest.json, which is signed (manifest.json.minisig)."
          gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "v$v" --repo "$GITHUB_REPOSITORY" --title "imanginable $v" --notes "$notes"
          for f in builds/*; do
            n=0
            until gh release upload "v$v" "$f" --repo "$GITHUB_REPOSITORY" --clobber; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then echo "giving up on $f"; exit 1; fi
              echo "upload failed ($n), retrying in 15s: $f"; sleep 15
            done
          done
      # dl.imanginable.com: builds first, the manifest and its signature last, so the
      # manifest never names a build that is not there yet. Same names every release.
      # Missing R2 secrets: the GitHub release above stands and this warns (installers
      # fall back to GitHub), rather than the whole publish failing.
      - name: publish to dl.imanginable.com (R2)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # R2 does not take the newer CRC headers
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "::warning::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY not set — $DL_URL was not updated"; exit 0; fi
          put() {  # put <file> <content-type>
            aws s3 cp "builds/$1" "s3://$R2_BUCKET/$1" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type "$2" --cache-control "public, max-age=300" --only-show-errors
          }
          for f in builds/imanginable-*; do put "$(basename "$f")" application/octet-stream; done
          put install.sh text/plain; put install.ps1 text/plain
          put manifest.json.minisig text/plain
          put manifest.json application/json
          echo "published $(ls builds | wc -l) files to $DL_URL"
